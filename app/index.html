<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KIUT Wellness PWA</title>
  <meta name="theme-color" content="#8B4513">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="pwa-body">
  <!-- Status Bar Area -->
  <div class="pwa-status-bar"></div>
  
  <!-- App Header -->
  <header class="pwa-header" id="pwaHeader">
    <button class="pwa-back-btn" id="pwaBackBtn" aria-label="Atrás" style="opacity:0; pointer-events:none">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="pwa-logo">
      <span class="pwa-logo-kiut">KIUT</span>
      <span class="pwa-logo-sub">Wellness</span>
    </div>
    <button class="pwa-header-action" id="pwaNotifBtn" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
  </header>

  <!-- App Content Area (screens swap here) -->
  <main class="pwa-content" id="pwaContent">
    <!-- Screens rendered by JS -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="pwa-bottom-nav" id="pwaBottomNav">
    <button class="pwa-nav-btn active" data-screen="home" aria-label="Inicio">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Inicio</span>
    </button>
    <button class="pwa-nav-btn" data-screen="ar" aria-label="Visualizar en AR">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Ver en AR</span>
    </button>
    <button class="pwa-nav-btn" data-screen="inventory" aria-label="Mis recargas">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Recargas</span>
    </button>
    <button class="pwa-nav-btn" data-screen="iot" aria-label="Control difusores">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M8.46 8.46a5 5 0 0 0 0 7.07"/></svg>
      <span>IoT</span>
    </button>
    <button class="pwa-nav-btn" data-screen="loyalty" aria-label="KIUT Family">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Familia</span>
    </button>
  </nav>

  <!-- Install Prompt Banner -->
  <div class="install-prompt" id="installPrompt" style="display:none">
    <div class="install-prompt-content">
      <span class="install-icon">📱</span>
      <div>
        <strong>Instalar KIUT Wellness</strong>
        <p>Acceso rápido sin abrir el browser</p>
      </div>
      <button class="btn-install" id="btnInstall">Instalar</button>
      <button class="btn-install-dismiss" id="btnInstallDismiss">✕</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
